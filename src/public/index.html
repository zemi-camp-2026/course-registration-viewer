<!DOCTYPE html>
<html lang="ja">
<head>
<!-- keep-alive: 2026-09-01 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>受講科目登録・閲覧システム</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="page">
  <div class="controls" id="controls">
    <div class="panel" id="grade-filter">
      <label><input type="checkbox" class="gf chk-b3" value="B3" checked>B3</label>
      <label><input type="checkbox" class="gf chk-b4" value="B4" checked>B4</label>
      <label><input type="checkbox" class="gf chk-m1" value="M1" checked>M1</label>
      <label><input type="checkbox" class="gf chk-m2" value="M2" checked>M2</label>
      <label><input type="checkbox" class="gf chk-prof" value="Prof" checked>教員</label>
    </div>
    <div class="panel">
      <label><input type="checkbox" id="highlight" class="chk-hl">ハイライト</label>
    </div>
    <div class="panel">
      <button type="button" class="btn-ghost btn-sm" id="free-toggle">空きコマ検索 ▼</button>
    </div>
    <div class="panel">
      <select id="mode">
        <option value="summary">サマリ</option>
        <option value="subject">授業名</option>
        <option value="detail">詳細</option>
      </select>
    </div>
    <div class="panel">
      <span style="font-size:12px;color:#a97b3a">スポット表示</span>
      <select id="spot"><option value="">全体図</option></select>
    </div>
    <button class="btn btn-primary" id="go-edit" style="margin-left:auto">📅 時間割登録・編集</button>
  </div>
  <!-- 空きコマ検索パネル（折りたたみ） -->
  <div id="free-panel" class="free-panel" style="display:none">
    <div id="free-grades" class="free-grades"></div>
    <div id="free-users" class="free-users"></div>
    <div class="free-actions">
      <button class="btn btn-primary btn-sm" id="free-search">空きコマ検索</button>
      <button class="btn btn-primary btn-sm" id="free-recommend" style="background:linear-gradient(180deg,#f9c93f 0%,#e5a200 100%)">おすすめ提案</button>
      <button class="btn btn-ghost btn-sm" id="free-clear">クリア</button>
      <span id="free-status" style="font-size:13px;color:#666"></span>
    </div>
    <!-- おすすめゼミ時間（オンデマンド表示） -->
    <div id="recommend-section" style="display:none"></div>
  </div>

  <h2 id="view-title" style="margin:14px 20px 0;font-size:16px;color:#a9743a"></h2>
  <div class="grid-wrap"><div id="grid"></div></div>
</div>

<script src="/app.js"></script>
<script>
let tabs;
let viewDays, viewPeriods; // 全体図基準のフィルタ済み曜日・時限（土曜/5限の自動非表示用）
let freeCells = null; // 空きコマ検索結果（Set of "day-period"）
let allUsers = []; // ユーザー一覧キャッシュ

function selectedGrades() {
  return [...document.querySelectorAll('.gf:checked')].map((el) => el.value);
}

// 行=時限 / 列=曜日 のグリッドを描画（軸転置後の向き・設計書2.2）
function drawGrid({ days, periods, cellMap, mode }) {
  const highlight = document.getElementById('highlight').checked;
  const table = document.createElement('table');
  table.className = 'timetable';
  const head = table.insertRow();
  head.innerHTML = `<th class="corner">時間割</th>` +
    days.map((d) => `<th>${DAY_NAMES[d]}</th>`).join('');
  for (const p of periods) {
    const row = table.insertRow();
    row.innerHTML = `<th class="period">${p}限</th>`;
    for (const d of days) {
      const td = row.insertCell();
      const cell = cellMap.get(`${d}-${p}`);
      const isFree = !cell || cell.count === 0;
      // 空きコマ検索中: freeCells に含まれるセルのみハイライト。未検索時はハイライトチェックで空きセルを強調
      const hl = freeCells ? freeCells.has(`${d}-${p}`) : (highlight && isFree);
      if (isFree) {
        td.className = 'free' + (hl ? ' hl' : '');
        continue;
      }
      if (hl) td.className = 'hl';
      if (mode === 'subject' && cell.entries) {
        // 科目名でグルーピング
        const groups = new Map();
        for (const e of cell.entries) {
          const key = e.subject_name || '';
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(e);
        }
        td.innerHTML = [...groups.entries()].map(([subj, members]) => {
          const byGrade = new Map();
          for (const m of members) {
            if (!byGrade.has(m.grade)) byGrade.set(m.grade, []);
            byGrade.get(m.grade).push(m.name);
          }
          const grades = [...byGrade.keys()].sort((a, b) => (GRADE_ORDER[a] ?? 99) - (GRADE_ORDER[b] ?? 99));
          const badges = grades.map((g) => {
            const names = byGrade.get(g).join('、');
            return `<span class="badge ${esc(g)}" title="${esc(names)}">${esc(g)}</span>`;
          }).join('');
          return `<div class="subj-card">` +
            `<div class="subj-badges">${badges}</div>` +
            `<div class="subject-label">${esc(subj)}</div>` +
            `</div>`;
        }).join('');
      } else if (mode === 'detail' && cell.entries) {
        td.innerHTML = cell.entries.map((e) =>
          `${badge(e.grade)}<span class="badge-detail">${esc(e.name)}${e.subject_name ? '「' + esc(e.subject_name) + '」' : ''}</span>`
        ).join('');
      } else {
        // サマリ: 学年バッジにホバーで氏名ツールチップ
        const sorted = [...cell.entries].sort((a, b) => (GRADE_ORDER[a.grade] ?? 9) - (GRADE_ORDER[b.grade] ?? 9));
        td.innerHTML = sorted.map((e) =>
          `<span class="badge ${esc(e.grade)}" title="${esc(e.name)}【${esc(e.subject_name)}】">${esc(e.grade)}</span>`
        ).join('');
      }
    }
  }
  const grid = document.getElementById('grid');
  grid.replaceChildren(table);
}

async function refresh() {
  const q = tabs.selected;
  const spot = document.getElementById('spot').value;
  const title = document.getElementById('view-title');

  if (spot) { // スポット表示: 個人の時間割（設計書7.2.1(d)）
    const data = await api(`/api/users/${spot}/schedule?quarter=${q.id}`);
    title.textContent = `${data.quarter.label} ｜ ${data.user.name}（${data.user.grade_label}）の時間割`;
    const cellMap = new Map(data.entries.map((e) => [`${e.day}-${e.period}`, {
      count: 1,
      entries: [{ name: data.user.name, grade: data.user.grade_label, subject_name: e.subject_name }],
    }]));
    const mode = document.getElementById('mode').value;
    drawGrid({ days: viewDays || data.days, periods: viewPeriods || data.periods, cellMap, mode });
    return;
  }

  const mode = document.getElementById('mode').value;
  const grades = selectedGrades().join(',');
  const data = await api(`/api/overview?quarter=${q.id}&mode=${mode}&grades=${grades}`);
  title.textContent = `${data.quarter.label} ｜ 全体図`;
  // 土曜・5限の自動非表示（閲覧画面のみ・設計書7.2.1(e)）
  const usedDays = new Set(data.cells.map((c) => c.day));
  const usedPeriods = new Set(data.cells.map((c) => c.period));
  viewDays = data.days.filter((d) => d !== 6 || usedDays.has(6));
  viewPeriods = data.periods.filter((p) => p !== 5 || usedPeriods.has(5));
  drawGrid({ days: viewDays, periods: viewPeriods, cellMap: new Map(data.cells.map((c) => [`${c.day}-${c.period}`, c])), mode });
}

// ---- 空きコマ検索パネル ----
function initFreePanel(users) {
  const panel = document.getElementById('free-panel');
  const toggle = document.getElementById('free-toggle');
  toggle.addEventListener('click', () => {
    const open = panel.style.display === 'none';
    panel.style.display = open ? '' : 'none';
    toggle.textContent = open ? '空きコマ検索 ▲' : '空きコマ検索 ▼';
  });

  // 学年一括チェックボックス
  const gradeGroups = {};
  for (const u of users) {
    const g = u.grade_label;
    if (!gradeGroups[g]) gradeGroups[g] = [];
    gradeGroups[g].push(u);
  }
  const gradesDiv = document.getElementById('free-grades');
  for (const g of Object.keys(gradeGroups).sort((a, b) => (GRADE_ORDER[a] ?? 9) - (GRADE_ORDER[b] ?? 9))) {
    const label = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.dataset.grade = g;
    cb.className = `chk-${g.toLowerCase()}`;
    cb.addEventListener('change', () => {
      document.querySelectorAll(`.free-user[data-grade="${g}"]`).forEach((el) => { el.checked = cb.checked; });
    });
    label.appendChild(cb);
    label.append(`${g}全員`);
    gradesDiv.appendChild(label);
  }

  // 個別ユーザーチェックボックス
  const usersDiv = document.getElementById('free-users');
  for (const u of users) {
    const label = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'free-user';
    cb.value = u.id;
    cb.dataset.grade = u.grade_label;
    label.appendChild(cb);
    label.append(`${u.name}`);
    usersDiv.appendChild(label);
  }

  // 検索ボタン
  document.getElementById('free-search').addEventListener('click', async () => {
    const ids = [...document.querySelectorAll('.free-user:checked')].map((el) => el.value);
    if (ids.length === 0) {
      document.getElementById('free-status').textContent = 'メンバーを選択してください';
      return;
    }
    const q = tabs.selected;
    const data = await api(`/api/free?quarter=${q.id}&users=${ids.join(',')}`);
    freeCells = new Set(data.free_cells.map((c) => `${c.day}-${c.period}`));
    document.getElementById('free-status').textContent = `共通空きコマ: ${data.free_cells.length}件`;
    await refresh();
  });

  // クリアボタン
  document.getElementById('free-clear').addEventListener('click', async () => {
    freeCells = null;
    document.querySelectorAll('.free-user, #free-grades input').forEach((el) => { el.checked = false; });
    document.getElementById('free-status').textContent = '';
    document.getElementById('recommend-section').style.display = 'none';
    document.getElementById('recommend-section').innerHTML = '';
    await refresh();
  });

  // おすすめ提案ボタン
  document.getElementById('free-recommend').addEventListener('click', async () => {
    const ids = [...document.querySelectorAll('.free-user:checked')].map((el) => el.value);
    if (ids.length === 0) {
      document.getElementById('free-status').textContent = 'メンバーを選択してください';
      return;
    }
    const q = tabs.selected;
    document.getElementById('free-status').textContent = '提案を計算中…';
    try {
      const data = await api(`/api/recommend?quarter=${q.id}&users=${ids.join(',')}`);
      showRecommend(data);
    } catch (e) {
      document.getElementById('free-status').textContent = e.message || 'エラーが発生しました';
    }
  });
}

// ---- おすすめゼミ時間（オンデマンド） ----
function showRecommend(data) {
  const section = document.getElementById('recommend-section');
  if (!data.recommendations || data.recommendations.length === 0) {
    section.style.display = '';
    section.innerHTML = '<p style="color:#666;margin:8px 0 0">おすすめの時間が見つかりませんでした</p>';
    document.getElementById('free-status').textContent = '';
    return;
  }
  const medals = ['🥇', '🥈', '🥉', '4.', '5.'];
  const items = data.recommendations.map((r, i) => {
    const dayName = DAY_NAMES[r.day] ?? r.day;
    const absent = r.absent.length > 0
      ? `<span style="color:#c0392b">（不参加: ${r.absent.map((n) => esc(n)).join('、')}）</span>`
      : '<span style="color:#27ae60">全員参加可能</span>';
    const d = r.score_detail ?? {};
    const detail = [
      `空き人数: ${esc(String(d.free ?? 0))}`,
      `通学日: +${esc(String(d.day ?? 0))}`,
      `授業間隔: ${esc(String(d.adjacent > 0 ? '+' : ''))}${esc(String(d.adjacent ?? 0))}`,
      ...(d.penalty ? [`端時限: ${esc(String(d.penalty))}`] : []),
    ].join('　');
    return `<div class="recommend-item" data-day="${esc(String(r.day))}" data-period="${esc(String(r.period))}">
      <span class="recommend-medal">${medals[i] ?? ''}</span>
      <strong>${esc(dayName)}${esc(String(r.period))}限</strong>
      <span style="color:#a97b3a;font-size:13px;font-weight:bold;margin:0 6px">${esc(String(r.score))}点</span>
      — ${esc(String(r.free_count))}/${esc(String(r.total))}人参加可 ${absent}
      <div style="font-size:11px;color:#999;margin:2px 0 0 28px">${detail}</div>
    </div>`;
  }).join('');
  section.style.display = '';
  section.innerHTML = `<h4 style="margin:10px 0 2px;color:#a97b3a;font-size:14px">おすすめゼミ時間</h4>`
    + `<p style="margin:0 0 6px;font-size:11px;color:#999">空き人数: 参加できる人の割合(最大70, 欠員が増えるほど急減)｜通学日: その日に大学にいる人が多い(最大15)｜授業間隔: 隣接+1, 2コマ離れ0, 3コマ-1, 4コマ-2(-30〜+15)｜端時限: 1限/5限は-5</p>`
    + items;
  document.getElementById('free-status').textContent = '';

  // 候補クリックでそのセルをハイライト
  section.querySelectorAll('.recommend-item').forEach((el) => {
    el.addEventListener('click', () => {
      const key = `${el.dataset.day}-${el.dataset.period}`;
      freeCells = new Set([key]);
      document.getElementById('free-status').textContent = `${DAY_NAMES[el.dataset.day]}${el.dataset.period}限をハイライト中`;
      refresh();
    });
  });
}

(async () => {
  const user = await renderChrome('home');
  document.getElementById('go-edit').addEventListener('click', () => {
    location.href = user ? '/edit.html' : '/login.html';
  });

  const controls = document.getElementById('controls');
  tabs = await renderQuarterTabs(controls, () => {
    freeCells = null;
    const rs = document.getElementById('recommend-section');
    rs.style.display = 'none'; rs.innerHTML = '';
    refresh();
  });
  controls.prepend(controls.querySelector('.qtabs')); // タブを先頭へ移動

  const { users } = await api('/api/users');
  allUsers = users;
  const spot = document.getElementById('spot');
  for (const u of users) {
    const o = document.createElement('option');
    o.value = u.id;
    o.textContent = `${u.name}（${u.grade_label}）`;
    spot.appendChild(o);
  }
  initFreePanel(users);

  document.querySelectorAll('#controls select, #controls input').forEach((el) =>
    el.addEventListener('change', refresh));
  await refresh();
})();
</script>
</body>
</html>
