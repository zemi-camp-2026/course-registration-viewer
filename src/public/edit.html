<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>時間割登録・編集｜受講科目登録・閲覧システム</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="page">
  <div class="controls" id="controls">
    <div class="panel" style="font-weight:bold" id="who"></div>
    <div class="panel" id="copy-panel">
      <span class="panel-title">コピー機能<span class="help-icon" tabindex="0">?<span class="help-tooltip">他のユーザーの時間割をコピーして自分の時間割に反映できます。ユーザーを選ぶとプレビューが表示されます。</span></span></span>
      <select id="copy-src"><option value="">コピー元を選択…</option></select>
      <span id="preview-actions" style="display:none">
        <button class="btn btn-ghost btn-sm" id="preview-cancel">取り消し</button>
        <button class="btn btn-primary btn-sm" id="preview-apply">コピー</button>
      </span>
    </div>
  </div>
  <h2 id="view-title" style="margin:14px 20px 0;font-size:16px;color:#a9743a"></h2>
  <div class="grid-wrap"><div id="grid"></div></div>
</div>
<div class="save-bar" id="save-bar">
  <span id="save-status" class="save-status"></span>
  <button class="btn btn-primary" id="save-btn" disabled>保存</button>
</div>
<div class="suggest-dropdown" id="suggest-dd"></div>

<script src="/app.js"></script>
<script>
let tabs, me;
let dirty = false;
let initialValues = {};
let suggestMap = {}; // { "1-1": [{name, count}, ...], ... }
let activeInput = null;
let activeIndex = -1;
let previewing = false;
let previewBackup = {};
let previewDirtyBackup = false;

const dd = document.getElementById('suggest-dd');

function setDirty(value) {
  dirty = value;
  const btn = document.getElementById('save-btn');
  const status = document.getElementById('save-status');
  btn.disabled = !value;
  if (value) {
    btn.textContent = '変更を保存';
    btn.classList.add('btn-dirty');
    status.textContent = '未保存';
    status.style.color = '#e57200';
  } else {
    btn.textContent = '保存';
    btn.classList.remove('btn-dirty');
    if (!status.dataset.keep) status.textContent = '';
  }
}

function onCellInput(e) {
  if (previewing) return;
  const inputs = document.querySelectorAll('.cell-input');
  let changed = false;
  for (const inp of inputs) {
    const key = inp.dataset.key;
    if ((inp.value || '') !== (initialValues[key] || '')) {
      changed = true;
      break;
    }
  }
  setDirty(changed);
  showSuggest(e.target);
}

async function loadSuggestions(quarterId) {
  try {
    const data = await api(`/api/subjects/suggest?quarter=${quarterId}`);
    suggestMap = data.cells || {};
  } catch { suggestMap = {}; }
}

// ---- カスタムオートコンプリート ----

function closeSuggest() {
  dd.classList.remove('open');
  activeInput = null;
  activeIndex = -1;
}

function positionDropdown(input) {
  const rect = input.getBoundingClientRect();
  const spaceBelow = window.innerHeight - rect.bottom;
  const openAbove = spaceBelow < 200;

  dd.style.left = rect.left + 'px';
  dd.style.width = rect.width + 'px';
  if (openAbove) {
    dd.style.top = 'auto';
    dd.style.bottom = (window.innerHeight - rect.top + 4) + 'px';
  } else {
    dd.style.top = (rect.bottom + 4) + 'px';
    dd.style.bottom = 'auto';
  }
}

function showSuggest(input, filter = true) {
  if (previewing) return;
  const key = input.dataset.key;
  const items = suggestMap[key] || [];

  let filtered;
  if (filter) {
    const q = input.value.trim().toLowerCase();
    filtered = q ? items.filter((s) => s.name.toLowerCase().includes(q)) : items;
  } else {
    filtered = items;
  }

  if (filtered.length === 0) {
    closeSuggest();
    return;
  }

  dd.innerHTML = '';
  filtered.forEach((s) => {
    const div = document.createElement('div');
    div.className = 'suggest-item';
    div.title = s.name;
    div.innerHTML = `<span class="suggest-item-name">${esc(s.name)}</span>`;
    div.addEventListener('mousedown', (e) => {
      e.preventDefault();
      input.value = s.name;
      closeSuggest();
      onCellInput({ target: input });
      input.blur();
    });
    dd.appendChild(div);
  });

  positionDropdown(input);
  dd.classList.add('open');
  activeInput = input;
  activeIndex = -1;
}

function highlightItem(index) {
  const items = dd.querySelectorAll('.suggest-item');
  items.forEach((el, i) => el.classList.toggle('active', i === index));
  if (items[index]) items[index].scrollIntoView({ block: 'nearest' });
}

function onSuggestKeydown(e) {
  if (!dd.classList.contains('open')) return;
  const items = dd.querySelectorAll('.suggest-item');
  if (items.length === 0) return;

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    activeIndex = Math.min(activeIndex + 1, items.length - 1);
    highlightItem(activeIndex);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    activeIndex = Math.max(activeIndex - 1, 0);
    highlightItem(activeIndex);
  } else if (e.key === 'Enter' && activeIndex >= 0) {
    e.preventDefault();
    items[activeIndex].dispatchEvent(new MouseEvent('mousedown'));
  } else if (e.key === 'Escape') {
    closeSuggest();
  }
}

// ---- 他ユーザーからコピー（プレビュー付き） ----

async function initCopyUI() {
  const { users } = await api('/api/users');
  const sel = document.getElementById('copy-src');

  // 自分を除外し、同学年を先頭にソート
  const others = users.filter((u) => u.id !== me.id);
  others.sort((a, b) => {
    const aMatch = a.grade === me.grade ? 0 : 1;
    const bMatch = b.grade === me.grade ? 0 : 1;
    return aMatch - bMatch || a.name.localeCompare(b.name, 'ja');
  });

  for (const u of others) {
    const o = document.createElement('option');
    o.value = u.id;
    o.textContent = `${u.name}（${u.grade_label}）`;
    sel.appendChild(o);
  }

  sel.addEventListener('change', () => { if (sel.value) startPreview(sel.value); });
  document.getElementById('preview-cancel').addEventListener('click', cancelPreview);
  document.getElementById('preview-apply').addEventListener('click', applyPreview);
}

async function startPreview(userId) {
  try {
    const data = await api(`/api/users/${userId}/schedule?quarter=${tabs.selected.id}`);
    const entryMap = new Map(data.entries.map((e) => [`${e.day}-${e.period}`, e]));

    // 現在の値をバックアップ
    const inputs = document.querySelectorAll('.cell-input');
    previewBackup = {};
    previewDirtyBackup = dirty;
    for (const inp of inputs) previewBackup[inp.dataset.key] = inp.value;
    previewBackup._title = document.getElementById('view-title').textContent;

    // プレビューデータをセット（読み取り専用）
    for (const inp of inputs) {
      const entry = entryMap.get(inp.dataset.key);
      inp.value = entry ? entry.subject_name : '';
      inp.readOnly = true;
    }

    // UI切替
    previewing = true;
    document.getElementById('grid').classList.add('previewing');
    document.getElementById('preview-actions').style.display = '';
    document.getElementById('copy-src').disabled = true;
    document.getElementById('save-btn').style.display = 'none';
    document.getElementById('view-title').textContent =
      `${data.quarter.label} ｜ ${data.user.name} の時間割（プレビュー）`;

    const status = document.getElementById('save-status');
    status.textContent = 'コピーまたは取り消しを選択してください';
    status.style.color = '#2b6cd4';
  } catch (err) {
    document.getElementById('copy-src').value = '';
    const status = document.getElementById('save-status');
    status.textContent = `読み込み失敗: ${err.message}`;
    status.style.color = '#d92f2f';
  }
}

function cancelPreview() {
  const inputs = document.querySelectorAll('.cell-input');
  for (const inp of inputs) {
    inp.value = previewBackup[inp.dataset.key] || '';
    inp.readOnly = false;
  }
  document.getElementById('view-title').textContent = previewBackup._title || '';
  endPreview();
  setDirty(previewDirtyBackup);
  document.getElementById('copy-src').value = '';
  const status = document.getElementById('save-status');
  status.textContent = '';
}

function applyPreview() {
  const inputs = document.querySelectorAll('.cell-input');
  for (const inp of inputs) inp.readOnly = false;
  document.getElementById('view-title').textContent = previewBackup._title || '';
  endPreview();

  // dirty 判定を更新
  let changed = false;
  for (const inp of inputs) {
    if ((inp.value || '') !== (initialValues[inp.dataset.key] || '')) { changed = true; break; }
  }
  setDirty(changed);

  const sel = document.getElementById('copy-src');
  const name = sel.options[sel.selectedIndex]?.textContent || '';
  const status = document.getElementById('save-status');
  status.textContent = `${name} の時間割をコピーしました`;
  status.style.color = '#2b6cd4';
}

function endPreview() {
  previewing = false;
  document.getElementById('grid').classList.remove('previewing');
  document.getElementById('preview-actions').style.display = 'none';
  document.getElementById('copy-src').disabled = false;
  document.getElementById('save-btn').style.display = '';
}

// ---- グリッド描画 ----

async function refresh() {
  const q = tabs.selected;
  const data = await api(`/api/users/${me.id}/schedule?quarter=${q.id}`);
  document.getElementById('view-title').textContent = `${data.quarter.label} ｜ 自分の時間割`;
  const entryMap = new Map(data.entries.map((e) => [`${e.day}-${e.period}`, e]));

  const table = document.createElement('table');
  table.className = 'timetable';
  const head = table.insertRow();
  head.innerHTML = `<th class="corner">✎ 編集</th>` +
    data.days.map((d) => `<th>${DAY_NAMES[d]}</th>`).join('');

  initialValues = {};
  for (const p of data.periods) {
    const row = table.insertRow();
    row.innerHTML = `<th class="period">${p}限</th>`;
    for (const d of data.days) {
      const td = row.insertCell();
      td.className = 'edit-cell';
      const key = `${d}-${p}`;
      const entry = entryMap.get(key);
      const value = entry ? entry.subject_name : '';
      initialValues[key] = value;

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'cell-input';
      input.placeholder = `${DAY_NAMES[d]}${p}`;
      input.autocomplete = 'off';
      input.dataset.day = d;
      input.dataset.period = p;
      input.dataset.key = key;
      input.value = value;
      input.addEventListener('input', onCellInput);
      input.addEventListener('focus', () => { if (previewing) { input.blur(); return; } input.placeholder = '科目名を入力'; showSuggest(input, false); });
      input.addEventListener('blur', () => { input.placeholder = `${DAY_NAMES[d]}${p}`; closeSuggest(); });
      input.addEventListener('keydown', onSuggestKeydown);
      td.appendChild(input);
    }
  }
  document.getElementById('grid').replaceChildren(table);
  setDirty(false);
  await loadSuggestions(q.id);
}

async function save() {
  const inputs = document.querySelectorAll('.cell-input');
  const entries = [];
  for (const inp of inputs) {
    const v = inp.value.trim();
    if (v !== '') {
      entries.push({
        day: parseInt(inp.dataset.day),
        period: parseInt(inp.dataset.period),
        subject_name: v,
      });
    }
  }
  const btn = document.getElementById('save-btn');
  const status = document.getElementById('save-status');
  btn.disabled = true;
  btn.textContent = '保存中…';
  status.textContent = '';
  try {
    await api(`/api/users/${me.id}/schedule?quarter=${tabs.selected.id}`, {
      method: 'PUT',
      body: { entries },
    });
    status.textContent = '✓ 保存しました';
    status.style.color = '#2e9e44';
    status.dataset.keep = '1';
    await refresh();
    delete status.dataset.keep;
  } catch (err) {
    status.textContent = `保存失敗: ${err.message}`;
    status.style.color = '#d92f2f';
    btn.textContent = '変更を保存';
    btn.disabled = false;
  }
}

window.addEventListener('beforeunload', (e) => {
  if (dirty || previewing) e.preventDefault();
});

// ページ内リンク（ホーム・プロフィール等）クリック時も未保存警告
document.addEventListener('click', (e) => {
  if (!dirty && !previewing) return;
  const a = e.target.closest('a[href]');
  if (!a || a.href === location.href) return;
  if (!confirm('未保存の変更があります。破棄してページを移動しますか？')) {
    e.preventDefault();
  }
});

(async () => {
  const user = await renderChrome('edit');
  if (!user) { location.href = '/login.html'; return; }
  if (!window.passwordSet) { location.href = '/login.html'; return; }
  me = user;
  document.getElementById('who').textContent = `${me.name}（${me.grade_label}）`;
  document.getElementById('save-btn').addEventListener('click', save);
  initCopyUI();

  const controls = document.getElementById('controls');
  tabs = await renderQuarterTabs(controls, async (q, revert) => {
    if (previewing) { revert(); return; }
    if (dirty && !confirm('未保存の変更があります。破棄して学期を切り替えますか？')) {
      revert();
      return;
    }
    await refresh();
  });
  controls.prepend(controls.querySelector('.qtabs'));
  await refresh();
})();
</script>
</body>
</html>
